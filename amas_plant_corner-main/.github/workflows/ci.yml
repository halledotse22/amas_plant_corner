
name: Website CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check HTML, CSS and JavaScript
        run: npx --yes prettier --check "**/*.{html,css,js}"

      - name: Validate HTML
        run: npx --yes html-validate "**/*.html"

      - name: Check JavaScript syntax
        run: |
          find . -name "*.js" -not -path "./.git/*" \
          -exec node --check {} \;
