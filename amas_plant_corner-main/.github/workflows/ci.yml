name: Website CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check HTML, CSS and JavaScript formatting
        run: npx --yes prettier --check --ignore-path .prettierignore "**/*.{html,css,js}"

      - name: Validate HTML
        run: |
          find . -type f -name "*.html" \
            -not -path "./.git/*" \
            -not -path "*/evidence/*" \
            -not -path "*/node_modules/*" \
            -print0 | xargs -0 -r npx --yes html-validate

      - name: Check JavaScript syntax
        run: |
          find . -type f -name "*.js" \
            -not -path "./.git/*" \
            -not -path "*/node_modules/*" \
            -print0 | xargs -0 -r -n 1 node --check
